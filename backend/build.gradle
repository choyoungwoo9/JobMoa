plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.3.21'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.youngwoo'
version = '0.1.0'
description = 'JobMoa local recruitment collector'

springBoot { mainClass = 'com.youngwoo.jobmoa.JobMoaApplicationKt' }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'com.microsoft.playwright:playwright:1.65.0'
    implementation 'org.apache.tika:tika-parsers-standard-package:4.2.0'
    runtimeOnly 'com.mysql:mysql-connector-j'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

tasks.register('copyRuntimeLibs', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('runtime-libs')
}

tasks.register('aiWorker', JavaExec) {
    group = 'application'
    description = 'Run the optional local Codex worker for JobMoa AI conversations.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.youngwoo.jobmoa.aiqa.worker.AiWorkerMainKt'
}
