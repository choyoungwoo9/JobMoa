server:
  port: ${SERVER_PORT:18080}
spring:
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2049MB
  mvc:
    async:
      request-timeout: 1800000
  application:
    name: jobmoa
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:13306/jobmoa?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${MYSQL_USER:jobmoa}
    password: ${MYSQL_PASSWORD:jobmoa-local}
    hikari:
      # 서로 다른 신규 공고를 저장할 때 빈 URL 해시 구간 잠금이 충돌하지 않도록 한다.
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        useAffectedRows: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
jobmoa:
  crawler:
    workers: ${CRAWLER_WORKERS:3}
    site-concurrency: ${CRAWLER_SITE_CONCURRENCY:1}
    minimum-navigation-interval: 700ms
    lease-duration: 2m
    navigation-timeout: 30s
    browser-channel: ${BROWSER_CHANNEL:}
    headless: true
    storage-directory: ${STORAGE_DIRECTORY:storage}
