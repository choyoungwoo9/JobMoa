services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobmoa
      MYSQL_USER: jobmoa
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jobmoa-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jobmoa-root-local}
      TZ: UTC
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  backend:
    build: ./backend
    shm_size: "1gb"
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/jobmoa?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jobmoa-local}
      STORAGE_DIRECTORY: /app/storage
      CRAWLER_WORKERS: ${CRAWLER_WORKERS:-3}
      CRAWLER_APPLICATION_PAGE_WORKERS: ${CRAWLER_APPLICATION_PAGE_WORKERS:-2}
      CRAWLER_SITE_CONCURRENCY: ${CRAWLER_SITE_CONCURRENCY:-1}
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:15173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  mysql-data:
